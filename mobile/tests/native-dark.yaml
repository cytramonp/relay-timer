appId: com.corptimer.app
---
- launchApp:
    clearState: true
- tapOn: 'Settings, tab, 5 of 5'
- tapOn: Dark
- tapOn: 'Meeting, tab, 1 of 5'
- scrollUntilVisible:
    element:
      text: Meeting name
    direction: UP
    centerElement: false
    timeout: 15000
- takeScreenshot: '${DEVICE_CLASS}-ios-dark-large-text'
