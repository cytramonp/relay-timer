<svg xmlns="http://www.w3.org/2000/svg" width="1270" height="714" viewBox="0 0 1270 714"><title>Online Stopwatch: numbered controls</title><desc>1. Start / Pause: Run, hold or resume this clock. 2. Lap: Record a split while running. 3. Reset: Return to the configured beginning. 4. Test sound: Check the selected sound and device volume.</desc><image href="stopwatch.jpg" width="1270" height="714"/><g><line x1="105" y1="318" x2="105" y2="339" stroke="#b92532" stroke-width="2"/><circle cx="105" cy="318" r="15" fill="#b92532" stroke="white" stroke-width="2"/><text x="105" y="323" fill="white" font-family="Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle">1</text></g><g><line x1="398" y1="318" x2="398" y2="339" stroke="#b92532" stroke-width="2"/><circle cx="398" cy="318" r="15" fill="#b92532" stroke="white" stroke-width="2"/><text x="398" y="323" fill="white" font-family="Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle">2</text></g><g><line x1="559" y1="318" x2="559" y2="339" stroke="#b92532" stroke-width="2"/><circle cx="559" cy="318" r="15" fill="#b92532" stroke="white" stroke-width="2"/><text x="559" y="323" fill="white" font-family="Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle">3</text></g><g><line x1="803" y1="171" x2="803" y2="191" stroke="#b92532" stroke-width="2"/><circle cx="803" cy="171" r="15" fill="#b92532" stroke="white" stroke-width="2"/><text x="803" y="176" fill="white" font-family="Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle">4</text></g></svg>