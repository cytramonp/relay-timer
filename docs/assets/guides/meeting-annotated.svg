<svg xmlns="http://www.w3.org/2000/svg" width="1270" height="714" viewBox="0 0 1270 714"><title>Meeting Timer: numbered controls</title><desc>1. Start / Next speaker: Begin the agenda or hand over to the next slot. 2. Pause: Hold the meeting clock. 3. Undo: Reverse the last handoff. 4. Reset: Return to the planned beginning.</desc><image href="meeting.jpg" width="1270" height="714"/><g><line x1="99" y1="269" x2="99" y2="290" stroke="#b92532" stroke-width="2"/><circle cx="99" cy="269" r="15" fill="#b92532" stroke="white" stroke-width="2"/><text x="99" y="274" fill="white" font-family="Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle">1</text></g><g><line x1="99" y1="320" x2="99" y2="341" stroke="#b92532" stroke-width="2"/><circle cx="99" cy="320" r="15" fill="#b92532" stroke="white" stroke-width="2"/><text x="99" y="325" fill="white" font-family="Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle">2</text></g><g><line x1="303" y1="320" x2="303" y2="341" stroke="#b92532" stroke-width="2"/><circle cx="303" cy="320" r="15" fill="#b92532" stroke="white" stroke-width="2"/><text x="303" y="325" fill="white" font-family="Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle">3</text></g><g><line x1="507" y1="320" x2="507" y2="341" stroke="#b92532" stroke-width="2"/><circle cx="507" cy="320" r="15" fill="#b92532" stroke="white" stroke-width="2"/><text x="507" y="325" fill="white" font-family="Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle">4</text></g></svg>