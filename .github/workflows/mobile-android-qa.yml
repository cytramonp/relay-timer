name: Android existing APK QA
on:
  push:
    branches: ['codex/corptimer-mobile']
    paths: ['.github/workflows/mobile-android-qa.yml']
  workflow_dispatch:
    inputs:
      apk_run_id:
        description: 'Run containing the APK artifact to verify (binary provenance is that run, not the test-script HEAD)'
        required: true
        default: '40798934523'
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: corptimer-android-test-apk
          path: mobile/android/app/build/outputs/apk/release
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.apk_run_id || '40798934523' }}
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_7_pro
          disable-animations: true
          script: python3 mobile/scripts/verify-meeting-android.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corptimer-android-native-captures
          path: mobile/native-captures/**
