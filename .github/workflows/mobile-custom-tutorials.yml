name: Custom timer native tutorials
on:
  workflow_dispatch:
    inputs:
      apk_run_id:
        description: Build run containing the exact release APK
        required: true
permissions:
  contents: read
  actions: read
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Export recipe expectations from this revision
        run: |
          mkdir -p mobile/custom-tutorials
          node --input-type=module -e "import {customRecipes} from './mobile/src/core/custom-recipes.ts'; import {writeFileSync} from 'node:fs'; writeFileSync('mobile/custom-tutorials/recipes.json', JSON.stringify(customRecipes,null,2));"
      - uses: actions/download-artifact@v4
        with:
          name: corptimer-android-test-apk
          path: mobile/android/app/build/outputs/apk/release
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.apk_run_id }}
      - name: Install caption renderer and enable emulator acceleration
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          APK_RUN_ID: ${{ inputs.apk_run_id }}
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_7_pro
          disable-animations: true
          script: python3 mobile/scripts/capture-custom-tutorials.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corptimer-custom-tutorials
          path: mobile/custom-tutorials/**
