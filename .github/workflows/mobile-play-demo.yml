name: Google Play floating timer demo
on:
  push:
    branches: ['codex/android-play-release']
    paths: ['.github/workflows/mobile-play-demo.yml']
  workflow_dispatch:
    inputs:
      apk_run_id:
        description: 'Build run containing the exact APK to record'
        required: true
        default: '41053160974'
permissions:
  contents: read
  actions: read
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: corptimer-android-test-apk
          path: mobile/android/app/build/outputs/apk/release
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.apk_run_id || '41053160974' }}
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          APK_RUN_ID: ${{ inputs.apk_run_id || '41053160974' }}
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_7_pro
          disable-animations: true
          script: python3 mobile/scripts/capture-play-demo.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corptimer-play-foreground-demo
          path: mobile/play-demo/**
