name: Android APK and Google Play bundle
on:
  push:
    branches: ['codex/corptimer-mobile', 'codex/android-play-release']
    paths: ['.github/workflows/mobile-android.yml', 'mobile/src/**', 'mobile/modules/**', 'mobile/scripts/verify-meeting-android.py', 'mobile/app.json', 'mobile/package*.json']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
        env:
          CI: '1'
      - name: Build standalone test APK with embedded JavaScript
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,x86_64 --no-daemon
        working-directory: mobile/android
        env:
          NODE_ENV: production
      - uses: actions/upload-artifact@v4
        with:
          name: corptimer-android-test-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Decode persistent Google Play upload key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.CORPTIMER_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Upload key not configured. APK beta still builds; Play upload remains blocked."
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/corptimer-upload.p12"
          echo "configured=true" >> "$GITHUB_OUTPUT"
      - name: Generate release signing configuration and build AAB
        if: steps.signing.outputs.configured == 'true'
        env:
          CI: '1'
          NODE_ENV: production
          CORPTIMER_UPLOAD_STORE_FILE: ${{ runner.temp }}/corptimer-upload.p12
          CORPTIMER_UPLOAD_STORE_PASSWORD: ${{ secrets.CORPTIMER_UPLOAD_STORE_PASSWORD }}
          CORPTIMER_UPLOAD_KEY_ALIAS: ${{ secrets.CORPTIMER_UPLOAD_KEY_ALIAS }}
          CORPTIMER_UPLOAD_KEY_PASSWORD: ${{ secrets.CORPTIMER_UPLOAD_KEY_PASSWORD }}
        run: |
          npx expo prebuild --platform android --no-install
          cd android
          ./gradlew bundleRelease -PreactNativeArchitectures=arm64-v8a,x86_64 --no-daemon
      - name: Verify native binary, permissions and 16 KB ELF alignment
        run: python3 scripts/verify-play-artifacts.py
      - name: Build an unsigned bundle for local signing when no CI key is configured
        if: steps.signing.outputs.configured != 'true'
        env:
          NODE_ENV: production
        run: |
          cd android
          ./gradlew bundleRelease -PreactNativeArchitectures=arm64-v8a,x86_64 --no-daemon
          cd ..
          python3 scripts/strip-bundle-signature.py android/app/build/outputs/bundle/release/app-release.aab android/app/build/outputs/bundle/release/CorpTimer-0.4.1-unsigned.aab
      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.configured != 'true'
        with:
          name: corptimer-google-play-unsigned
          path: |
            mobile/android/app/build/outputs/bundle/release/CorpTimer-0.4.1-unsigned.aab
            mobile/play-artifact-report.json
          if-no-files-found: error
          retention-days: 30
      - name: Validate signed bundle with Google's bundletool
        if: steps.signing.outputs.configured == 'true'
        run: |
          curl -fsSL https://api.github.com/repos/google/bundletool/releases/latest -o "$RUNNER_TEMP/bundletool-release.json"
          URL=$(python3 -c 'import json,os;d=json.load(open(os.environ["RUNNER_TEMP"]+"/bundletool-release.json"));print(next(a["browser_download_url"] for a in d["assets"] if a["name"].endswith(".jar")))')
          curl -fsSL "$URL" -o "$RUNNER_TEMP/bundletool.jar"
          java -jar "$RUNNER_TEMP/bundletool.jar" validate --bundle=android/app/build/outputs/bundle/release/app-release.aab
          java -jar "$RUNNER_TEMP/bundletool.jar" dump config --bundle=android/app/build/outputs/bundle/release/app-release.aab > android/app/build/outputs/bundle/release/bundle-config.json
          jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.configured == 'true'
        with:
          name: corptimer-google-play-upload
          path: |
            mobile/android/app/build/outputs/bundle/release/*.aab
            mobile/android/app/build/outputs/bundle/release/bundle-config.json
            mobile/play-artifact-report.json
          if-no-files-found: error
          retention-days: 30
      - name: Enable emulator acceleration on the ephemeral runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_7_pro
          disable-animations: true
          script: python3 mobile/scripts/verify-meeting-android.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corptimer-android-native-captures
          path: mobile/native-captures/**
