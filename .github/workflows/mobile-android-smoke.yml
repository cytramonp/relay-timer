name: Android native smoke
on:
  push:
    branches: ['codex/corptimer-mobile']
    paths: ['.github/workflows/mobile-android-smoke.yml', 'mobile/scripts/capture-android.py']
  workflow_dispatch:
    inputs:
      apk_run_id:
        description: 'Actions run containing corptimer-android-test-apk'
        default: '40442443820'
        required: true
permissions:
  contents: read
  actions: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download compiled APK
        env:
          GH_TOKEN: ${{ github.token }}
          APK_RUN_ID: ${{ inputs.apk_run_id || '40442443820' }}
        run: gh run download "$APK_RUN_ID" --repo "$GITHUB_REPOSITORY" --name corptimer-android-test-apk --dir mobile/android/app/build/outputs/apk/release
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_7_pro
          disable-animations: true
          script: python3 mobile/scripts/capture-android.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corptimer-android-smoke-evidence
          path: mobile/native-captures/*
